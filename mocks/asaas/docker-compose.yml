services:
  asaas:
    # This compose is the DEVELOPMENT one: since `build` is present, a
    # `docker compose up` here compiles the local code and ignores the registry. The
    # `image` only names the resulting tag.
    #
    # To CONSUME the simulator in another project, do not copy this file: copy the
    # block of the README's "Use it in another project" section, which has only
    # `image:` and pulls the published image from GHCR.
    image: ghcr.io/instituto-ama/asaas-mock:latest
    build: .
    container_name: asaas-mock
    ports:
      - '${PORT:-45445}:45445'
    env_file:
      # Optional on purpose: `docker compose up` has to work on a clean clone,
      # with no prior step. Copy the .env.example if you want to pin the
      # API key or change the fees — otherwise the defaults apply and the key is
      # generated and PRINTED on boot.
      - path: .env
        required: false
    environment:
      PORT: 45445
      TZ: America/Sao_Paulo
      DATABASE_PATH: /data/asaas.db

      # ─────────────────────────────────────────────────────────────────
      # THE LINE THAT MAKES THE PROJECT MAKE SENSE.
      #
      # Inside the container, "localhost" is the container ITSELF. A webhook
      # pointed at http://localhost:3000 would hit it and never reach
      # your application. Here we rewrite the host so that the event leaves the
      # container and reaches your machine.
      #
      # Leave it empty to turn it off (running outside Docker).
      # ─────────────────────────────────────────────────────────────────
      WEBHOOK_LOCALHOST_REWRITE: host.docker.internal

      # ─────────────────────────────────────────────────────────────────
      # The clock STARTS at the real time and TICKS normally — but you can
      # skip ahead. It is what makes `+32 days` in the panel work (and the
      # PAYMENT_RECEIVED webhook arrive in milliseconds instead of in a month).
      #
      # In REAL (the code's default) time travel is refused, and the
      # panel's buttons are born disabled — which empties the reason the
      # panel exists. That is why the compose picks VIRTUAL_FLOWING.
      #
      # Use VIRTUAL_FROZEN if you want 100% deterministic time (CI).
      # ─────────────────────────────────────────────────────────────────
      CLOCK_MODE: ${CLOCK_MODE:-VIRTUAL_FLOWING}

    extra_hosts:
      # On Docker Desktop (macOS/Windows) host.docker.internal already exists.
      # On Linux it does not — this line is what makes it work there too.
      - 'host.docker.internal:host-gateway'

    volumes:
      - asaas-data:/data

    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "await fetch('http://localhost:45445/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    restart: unless-stopped

volumes:
  asaas-data:
