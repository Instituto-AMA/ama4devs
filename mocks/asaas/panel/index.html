<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asaas Mock Server</title>
    <!--
      A fonte do Atlas carrega SEM BLOQUEAR: `media="print"` faz o browser buscar em
      background e o onload a promove. Um container de CI sem rede continua pintando a
      tela na hora, com a fonte do sistema, em vez de travar esperando o Google.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <!--
      Aplica o tema ANTES do primeiro paint. Sem isto, quem escolheu o escuro toma um
      flash branco em cada reload — o React/Preact só monta depois, e até lá o browser
      já pintou a página com os tokens claros.
    -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('asaas-mock:theme') === 'dark' ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
