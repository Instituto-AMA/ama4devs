  <body>
    <div id="app"></div>
    <!--
      Applies the theme BEFORE the first paint. Without this, whoever chose the
      dark one gets a white flash on every reload — React/Preact only mounts
      later, and by then the browser already painted the page with the light
      tokens.
    -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('asaas-mock:theme') === 'dark' ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </body>
