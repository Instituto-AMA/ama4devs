name: ama4devs

services:
  asaas:
    build: ./mocks/asaas
    image: ama4devs/asaas:local
    profiles: [asaas]
    ports:
      - '127.0.0.1:${ASAAS_PORT:-45445}:45445'
    environment:
      PORT: 45445
      TZ: America/Sao_Paulo
      DATABASE_PATH: /data/asaas.db
      # Fake key of the local mock; `$$` is compose's escape for a literal `$`.
      ASAAS_API_KEY: ${ASAAS_API_KEY:-$$aact_hmlg_local_master}
      SEED_EXTRA_ACCOUNTS: ${ASAAS_SEED_EXTRA_ACCOUNTS:-}
      CLOCK_MODE: ${ASAAS_CLOCK_MODE:-VIRTUAL_FLOWING}
      # Inside the container "localhost" is the container itself: rewrite it to the host.
      WEBHOOK_LOCALHOST_REWRITE: host.docker.internal
      # Payer notifications: the e-mail to Mailpit, the WhatsApp template to the WhatsApp mock.
      # Nothing to wire: the mock finds both services by name, and the address the WhatsApp
      # mock calls back on, by itself. Integrations opens these pages in the browser.
      MAILPIT_UI_URL: http://localhost:${MAILPIT_PORT:-8025}
      WHATSAPP_UI_URL: http://localhost:${WHATSAPP_PORT:-3010}
      # The generator of fake data: the Asaas mock finds it by service name; this is where the
      # browser opens it.
      GENERATOR_UI_URL: http://localhost:${GENERATOR_PORT:-45450}
      # The SMS mock: the Asaas mock finds it by service name and sends the payer SMS to it;
      # this is where the browser opens it.
      SMS_UI_URL: http://localhost:${SMS_PORT:-8899}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - asaas-data:/data
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "await fetch('http://localhost:45445/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  whatsapp:
    build: ./mocks/whatsapp
    image: ama4devs/whatsapp:local
    profiles: [whatsapp]
    ports:
      - '127.0.0.1:${WHATSAPP_PORT:-3010}:3010'
    environment:
      PORT: 3010
      WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
      WEBHOOK_LOCALHOST_REWRITE: host.docker.internal
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # The SQLite file and the uploaded media (WHAP_DATA_DIR=/app/data in the image).
    volumes:
      - whatsapp-data:/app/data
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://localhost:3010/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Fake Brazilian data (people, companies, CPF, CNPJ, addresses) and the one-call population of
  # the Asaas mock. Rides the asaas profile, like mailpit: `make up` brings it with Asaas.
  generator:
    build: ./mocks/generator
    image: ama4devs/generator:local
    profiles: [generator, asaas]
    ports:
      - '127.0.0.1:${GENERATOR_PORT:-45450}:45450'
    environment:
      PORT: 45450
      ASAAS_API_KEY: ${ASAAS_API_KEY:-$$aact_hmlg_local_master}
      ASAAS_PANEL_URL: http://localhost:${ASAAS_PORT:-45445}
      ASAAS_SEED_ON_BOOT: ${GENERATOR_ASAAS_SEED_ON_BOOT:-}
      WEBHOOK_LOCALHOST_REWRITE: host.docker.internal
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # On by default; GENERATOR_ENABLED=0 in .env keeps it down (the Asaas mock then never finds it and hides
    # Integrations › Generator).
    deploy:
      replicas: ${GENERATOR_ENABLED:-1}
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "await fetch('http://localhost:45450/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped

  # The SMS gateway simulator: it receives the payer SMS of the Asaas mock, runs their lifecycle
  # and posts the webhooks. Rides the asaas profile, like the generator: `make up` brings it with
  # Asaas, already found and configured. `make up MOCKS=sms` starts only it.
  sms:
    build: ./mocks/sms
    image: ama4devs/sms:local
    profiles: [sms, asaas]
    ports:
      - '127.0.0.1:${SMS_PORT:-8899}:8899'
    environment:
      PORT: 8899
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_SECRET: ${SMS_WEBHOOK_SECRET:-}
      WEBHOOK_LOCALHOST_REWRITE: host.docker.internal
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # On by default; SMS_ENABLED=0 in .env keeps it down (the Asaas mock then never finds it and
    # sends no SMS).
    deploy:
      replicas: ${SMS_ENABLED:-1}
    # The store is in memory: the messages live only while the container runs, so there is no volume.
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "await fetch('http://localhost:8899/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped

  # The mailbox of the payer e-mails the Asaas mock sends (UI on :8025). Starts with
  # the asaas profile; `MAILPIT_PORT` moves it when another Mailpit holds 8025.
  mailpit:
    image: axllent/mailpit:v1.31.4
    profiles: [asaas, mail]
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'
    restart: unless-stopped

volumes:
  asaas-data:
  whatsapp-data:
